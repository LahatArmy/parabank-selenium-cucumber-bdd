name: Parabank Automation Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Memungkinkan menjalankan tes secara manual lewat tombol di GitHub

jobs:
  run-selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          java-version: '27'
          distribution: 'zulu'
          cache: maven

      - name: Run Cucumber Selenium Tests
        run: mvn test -B

      - name: Upload Cucumber HTML Report
        uses: actions/upload-artifact@v4
        if: always() # Tetap upload report meskipun ada skenario yang gagal
        with:
          name: cucumber-test-report
          path: target/cucumber-reports/report.html
          retention-days: 14